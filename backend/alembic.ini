# Alembic config. Run: cd backend && alembic upgrade head
#
# sqlalchemy.url is intentionally NOT set here -- env.py pulls it from
# settings.database_url (single source of truth, no duplicated connection string).
#
# KEEP THIS FILE ASCII-ONLY: fileConfig() reads it with the OS locale encoding
# (cp874 on Thai Windows, not UTF-8), so Thai text or em-dashes here crash Alembic.
# Put Thai comments in the .py files instead -- Python always reads those as UTF-8.
[alembic]
# %(here)s = the directory of alembic.ini itself (backend/), so the path is
# correct no matter the cwd (pytest runs from repo root, alembic CLI from backend/).
script_location = %(here)s/app/database/migrations
prepend_sys_path = %(here)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
