; ตั้งค่า pytest ของทั้ง repo
; ที่ต้องมีไฟล์นี้: tests/ อยู่ระดับ repo แต่โค้ดอยู่ใน backend/ (import app.*)
; ถ้าไม่บอก pythonpath ไว้ เทสจะ import app.* ไม่เจอตั้งแต่บรรทัดแรก
[pytest]
pythonpath = backend
testpaths = tests
addopts = -q --strict-markers
markers =
    integration: ยิงระบบภายนอกจริง (loga) — ต้องมี credential ใน env มิฉะนั้น skip เอง
filterwarnings =
    # starlette TestClient เตือนเรื่อง httpx — เป็นของ framework ไม่ใช่โค้ดเรา ไม่กระทบการทำงาน
    ignore:Using `httpx` with `starlette.testclient` is deprecated
